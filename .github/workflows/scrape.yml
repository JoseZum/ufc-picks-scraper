name: UFC Scraper

on:
  schedule:
    # Scraping de resultados: Cada 2 horas durante eventos (sábados y domingos)
    - cron: "0 */2 * * 0,6"      # Reducido de 30 min a 2 horas, solo fines de semana (0=domingo, 6=sábado)

    # Descubrimiento de eventos: 2 veces por semana (lunes y jueves)
    - cron: "0 2 * * 1,4"         # Aumentado de 1 vez a 2 veces/semana

    # Backfill de imágenes (proxy): Diario
    - cron: "0 3 * * *"           # Sin cambios

    # Subida de imágenes de fighters a S3: diario
    - cron: "0 4 * * *"           # Diario para no acumular faltantes

  workflow_dispatch:
    inputs:
      mode:
        type: choice
        options:
          - scheduled
          - discover
          - images
          - fighter_images
        default: scheduled

jobs:
  scheduled:
    name: Scheduled Results
    runs-on: ubuntu-latest
    if: |
      (github.event_name == 'schedule' && github.event.schedule == '0 */2 * * 0,6') ||
      github.event.inputs.mode == 'scheduled'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: python scheduler.py
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}

  discover:
    name: Discover Events
    runs-on: ubuntu-latest
    if: |
      (github.event_name == 'schedule' && github.event.schedule == '0 2 * * 1,4') ||
      github.event.inputs.mode == 'discover'
    env:
      MONGODB_URI: ${{ secrets.MONGODB_URI }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      # Nunca reutilizar raw.jsonl del repo: un crawl bloqueado por Tapology
      # debe fallar, no reingestar un snapshot viejo.
      - name: Discover and validate fresh card data
        run: |
          RAW_FILE="$(mktemp --suffix=.jsonl)"
          if scrapy crawl ufc -O "$RAW_FILE" && python validate_feed.py --raw-file "$RAW_FILE" --min-events 1 --min-bouts 1; then
            echo "Tapology snapshot validated."
          else
            echo "Tapology did not provide a usable snapshot; using the public UFC event pages."
            scrapy crawl official_ufc -O "$RAW_FILE"
            python validate_feed.py --raw-file "$RAW_FILE" --min-events 1 --min-bouts 1
          fi
          python ingest.py --raw-file "$RAW_FILE"

  images:
    name: Backfill Images (Proxy)
    runs-on: ubuntu-latest
    if: |
      (github.event_name == 'schedule' && github.event.schedule == '0 3 * * *') ||
      github.event.inputs.mode == 'images'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: Refresh official UFC cards and images
        run: |
          IMAGE_FEED="$(mktemp --suffix=.jsonl)"
          scrapy crawl official_ufc -O "$IMAGE_FEED"
          python validate_feed.py --raw-file "$IMAGE_FEED" --min-events 1 --min-bouts 1
          python ingest.py --raw-file "$IMAGE_FEED"
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}

  fighter-images:
    name: Upload Fighter Images to S3
    runs-on: ubuntu-latest
    if: |
      (github.event_name == 'schedule' && github.event.schedule == '0 4 * * *') ||
      github.event.inputs.mode == 'fighter_images'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt

      - name: Run fighter images spider
        run: scrapy crawl fighter_images
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_S3_BUCKET: ${{ secrets.AWS_S3_BUCKET }}
          AWS_REGION: us-east-1
          IMAGE_SOURCE_MODE: s3
          JWT_SECRET: dummy-secret-for-scraping
          GOOGLE_CLIENT_ID: dummy-client-id-for-scraping

      # Log resultados
      - name: Summary
        if: always()
        run: |
          echo "Fighter images spider completed"
          echo "Check logs above for details on uploaded images"
