name: UFC Scraper

on:
  schedule:
    # Resultados ESPN: cada 2 horas; sólo carga peleas finalizadas sin resultado
    - cron: "20 */2 * * *"

    # ETL general ESPN: 2 veces por semana (carteleras, perfiles, stats y fotos)
    - cron: "0 2 * * 1,4"

    # Refresco diario de las carteleras proximas. Existe por la politica de
    # ausencias: `AUTO_REMOVAL_REQUIRED_MISSES = 3` cuenta solo observaciones de
    # cobertura `complete`. MODE=results tambien pide detalle por competencia y
    # puede alcanzar el umbral durante fight week; esta pasada diaria mantiene
    # una segunda via explicita para todas las carteleras proximas.
    - cron: "0 5 * * *"

    # Posters de Wikipedia/origen + hero oficial UFC: diario
    - cron: "0 3 * * *"           # Sin cambios

    # Backfill de headshots ESPN a S3: diario
    - cron: "0 4 * * *"

  workflow_dispatch:
    inputs:
      mode:
        type: choice
        options:
          - scheduled
          - discover
          - images
          - fighter_images
          - espn_results
          - espn_general
          - espn_upcoming
          - espn_photos
          - event_images_season
        default: scheduled
      season:
        description: >-
          Season to re-resolve posters for with mode=event_images_season, e.g.
          2026. The daily image job only looks 14 days back, so a card whose
          poster lookup failed once can never be retried by the schedule.
        type: string
        default: "2026"

jobs:
  scheduled:
    name: ESPN Results ETL
    runs-on: ubuntu-latest
    if: |
      (github.event_name == 'schedule' && github.event.schedule == '20 */2 * * *') ||
      github.event.inputs.mode == 'scheduled' ||
      github.event.inputs.mode == 'espn_results'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: Fill missing fight results and score picks
        run: |
          set -o pipefail
          scrapy crawl espn -a MODE=results 2>&1 | tee espn-results.log
          ! grep -Eq "ESPN request failed|Canonical card write failed|spider_exceptions/count" espn-results.log
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}

      # El ETL escribe resultados directo en Mongo, sin pasar por
      # `PUT /admin/bouts/{id}/result`, que era el unico camino que disparaba el
      # motor de misiones. Sin este paso los resultados entran y las misiones se
      # quedan congeladas. El endpoint es idempotente por (bout, revision).
      - name: Evaluate missions for the results just written
        if: success()
        run: |
          set -o pipefail
          code=$(curl -sS -o reconcile.json -w "%{http_code}" -X POST \
            -H "X-Mission-Reconcile-Token: ${{ secrets.MISSION_RECONCILE_TOKEN }}" \
            "${{ secrets.API_BASE_URL }}/admin/missions/evaluation/reconcile")
          cat reconcile.json
          echo
          if [ "$code" != "200" ]; then
            echo "Mission reconcile failed with HTTP $code"
            exit 1
          fi
          # Un error por bout no rompe la pasada, pero no puede pasar en silencio.
          python - <<'PY'
          import json, sys
          report = json.load(open("reconcile.json"))
          print("missions reconciled:", json.dumps(report, indent=2)[:2000])
          if report.get("errors"):
              print("Mission evaluation reported errors")
              sys.exit(1)
          PY

  discover:
    name: ESPN General ETL
    runs-on: ubuntu-latest
    if: |
      (github.event_name == 'schedule' && github.event.schedule == '0 2 * * 1,4') ||
      github.event.inputs.mode == 'discover' ||
      github.event.inputs.mode == 'espn_general'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: Refresh cards, fighter data, records, photos, and available results
        run: |
          set -o pipefail
          scrapy crawl espn -a MODE=general -a DAYS_BACK=14 -a DAYS_AHEAD=60 2>&1 | tee espn-general.log
          # `plan blocked` se omite a proposito: el ETL revisita cada evento
          # conforme llegan los detalles y las pasadas intermedias se bloquean
          # sin que eso sea un fallo. `write failed` es la no-convergencia real.
          ! grep -Eq "ESPN request failed|Canonical card write failed|Failed ESPN headshot|headshots failed|spider_exceptions/count" espn-general.log
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_S3_BUCKET: ${{ secrets.AWS_S3_BUCKET }}
          AWS_REGION: us-east-1
          IMAGE_SOURCE_MODE: s3

  upcoming_cards:
    name: ESPN Upcoming Cards Refresh
    runs-on: ubuntu-latest
    if: |
      (github.event_name == 'schedule' && github.event.schedule == '0 5 * * *') ||
      github.event.inputs.mode == 'espn_upcoming'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      # Ventana corta a proposito: esto no reemplaza al ETL general, solo
      # alimenta la politica de ausencias con una observacion `complete` diaria
      # de las cards que estan dentro de los 7 dias previos al lock.
      - name: Refresh cards locking within the absence-policy window
        run: |
          set -o pipefail
          scrapy crawl espn -a MODE=general -a DAYS_BACK=1 -a DAYS_AHEAD=8 2>&1 | tee espn-upcoming.log
          ! grep -Eq "ESPN request failed|Canonical card write failed|Failed ESPN headshot|headshots failed|spider_exceptions/count" espn-upcoming.log
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_S3_BUCKET: ${{ secrets.AWS_S3_BUCKET }}
          AWS_REGION: us-east-1
          IMAGE_SOURCE_MODE: s3

  images:
    name: Refresh Event Images (Wikipedia + UFC)
    runs-on: ubuntu-latest
    if: |
      (github.event_name == 'schedule' && github.event.schedule == '0 3 * * *') ||
      github.event.inputs.mode == 'images'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: Resolve Wikipedia card posters and official UFC heroes
        run: |
          set -o pipefail
          scrapy crawl event_images 2>&1 | tee event-images.log
          ! grep -Eq "EVENT_IMAGE_COVERAGE_FAILED|spider_exceptions/count" event-images.log
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}

  event-images-season:
    name: Re-resolve Event Posters for a Season
    runs-on: ubuntu-latest
    # Manual only. The daily `images` job is scoped to the display window, so a
    # completed card that missed its poster stays blank forever; this is the
    # only way to go back for it.
    if: |
      github.event_name == 'workflow_dispatch' &&
      github.event.inputs.mode == 'event_images_season'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: Resolve posters and heroes for the whole season
        run: scrapy crawl event_images -a SEASON=${{ github.event.inputs.season }}
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}

  fighter-images:
    name: ESPN Fighter Photos
    runs-on: ubuntu-latest
    if: |
      (github.event_name == 'schedule' && github.event.schedule == '0 4 * * *') ||
      github.event.inputs.mode == 'fighter_images' ||
      github.event.inputs.mode == 'espn_photos'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt

      - name: Refresh missing upcoming-card ESPN headshots
        run: |
          set -o pipefail
          scrapy crawl espn -a MODE=photos -a DAYS_AHEAD=60 2>&1 | tee espn-photos.log
          ! grep -Eq "ESPN request failed|Failed ESPN headshot|headshots failed|spider_exceptions/count" espn-photos.log
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_S3_BUCKET: ${{ secrets.AWS_S3_BUCKET }}
          AWS_REGION: us-east-1
          IMAGE_SOURCE_MODE: s3

      - name: Summary
        if: always()
        run: |
          echo "ESPN fighter photo refresh completed"
          echo "Check logs above for uploaded and skipped headshots"
